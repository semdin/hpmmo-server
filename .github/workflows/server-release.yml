# HPMMO server release - runs on the self-hosted runner on the game host.
#
#   push to main        -> build + test + package an immutable artifact, then
#                          deploy it
#   manual dispatch     -> optionally deploy ; release_id may pin an
#                          earlier artifact still in the host's local store
#
# Why self-hosted (2026-10-19): the runner keeps its checkout between runs, so
# Git LFS only downloads objects that changed (a GitHub-hosted runner pulled
# ~310 MB of LFS per push, which was the bill), and the artifact never leaves
# the box: it goes into a local store instead of upload/download-artifact, and
# the deploy is a local call instead of scp + ssh.
#
# Rules encoded here:
#   * deploys go out on every push to main (no approval gate), as before;
#   * only a successfully built + rehearsed artifact is ever deployed, and the
#     deploy job pins its exact id and re-verifies its SHA256SUMS;
#   * feature branches never touch production (they cannot even reach the
#     deploy job - see the ref check);
#   * the build job's concurrency group cancels obsolete builds, the deploy
#     job's never cancels (the controller's own flock is the second line);
#   * never add a `pull_request` trigger: this runner is the production host.
#
# Host setup (once, see server/docs/self-hosted-runner.md):
#   runner user `ghrunner`, label `hpmmo-server`, slice hpmmo-ci.slice (CPU/mem
#   capped so a build cannot starve the world server), NOPASSWD sudo for exactly
#   /opt/hpmmo/bin/hpmmo_deploy.sh, Godot at /opt/hpmmo-ci/godot/godot, artifact
#   store /var/lib/hpmmo-ci/artifacts.
name: server-release

on:
  push:
    branches: [main]          # the designated server release branch
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        type: boolean
        default: false
      release_id:
        description: 'Release id (commit sha) to deploy from the host artifact store (default: this commit)'
        type: string
        required: false

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  HPMMO_GODOT_BIN: /opt/hpmmo-ci/godot/godot
  ARTIFACT_STORE: /var/lib/hpmmo-ci/artifacts
  # Artifacts kept in the store (each ~0.8 GB): enough to redeploy recent ones.
  ARTIFACT_KEEP: '3'

jobs:
  # -------------------------------------------------------------------------
  # Build, test and package the Linux server artifact.
  # -------------------------------------------------------------------------
  package:
    name: build + package (linux)
    runs-on: [self-hosted, hpmmo-server]
    concurrency:
      group: server-build-package-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      release_id: ${{ steps.id.outputs.release_id }}
    steps:
      # Players hear about the restart when the build starts (a few minutes
      # ahead), not only from the 30 s maintenance countdown at the end. A
      # heads-up only: it changes nothing and never fails the build.
      - name: Tell the players an update is coming
        if: github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: |
          sudo -n /opt/hpmmo/bin/hpmmo_deploy.sh --announce-update 3 \
            || echo "::warning::the update heads-up was not delivered"

      - uses: actions/checkout@v7

      # The world tree keeps its models in Git LFS, served by our own LFS
      # server (lfs.agsilvery.com -> Cloudflare R2, see .lfsconfig; the runner
      # user holds its credentials). Pulled after checkout so .lfsconfig is in
      # the tree; the workspace persists, so only new objects are fetched.
      # Without it the artifact ships pointer files and the live world cannot
      # parse its model preloads.
      - name: Pull the LFS objects
        run: |
          git lfs pull
          if git lfs ls-files | grep -q ' - '; then
            echo "::error::some LFS objects were not downloaded"; git lfs ls-files | grep ' - ' | head; exit 1
          fi

      - name: Pin the artifact identifier
        id: id
        run: echo "release_id=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the C++ service
        run: |
          cmake -S services/cpp -B services/cpp/build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          ninja -C services/cpp/build
          ./services/cpp/build/hpmmo_service version

      - name: Check the pinned Godot engine (for the world import cache)
        run: |
          "$HPMMO_GODOT_BIN" --version | grep -q "^${GODOT_VERSION}\.stable" || {
            echo "::error::$HPMMO_GODOT_BIN is not Godot ${GODOT_VERSION}"; exit 1; }

      - name: Rehearse the deployment controller (temp dir, stub services)
        run: python3 tests/deploy_rehearsal.py

      - name: Package the immutable release artifact (with SHA256SUMS)
        run: |
          rm -rf dist
          HPMMO_GODOT="$HPMMO_GODOT_BIN" \
            bash deploy/package_server.sh --out dist --id "${{ steps.id.outputs.release_id }}"

      - name: Verify the artifact and put it in the host store
        run: |
          set -eu
          id="${{ steps.id.outputs.release_id }}"
          archive="dist/hpmmo-server-$id.tar.gz"
          test -f "$archive" || { echo "artifact $archive is missing" >&2; exit 1; }
          verify="$RUNNER_TEMP/verify"; rm -rf "$verify"; mkdir -p "$verify"
          tar -C "$verify" -xzf "$archive"
          ( cd "$verify" && sha256sum -c --strict --quiet SHA256SUMS )
          test -x "$verify/services/cpp/build/hpmmo_service"
          rm -rf "$verify"
          mkdir -p "$ARTIFACT_STORE"
          mv -f "$archive" "$archive.sha256" "$ARTIFACT_STORE/"
          rm -rf dist
          # Keep the newest ARTIFACT_KEEP artifacts.
          ls -1t "$ARTIFACT_STORE"/hpmmo-server-*.tar.gz | tail -n +"$((ARTIFACT_KEEP + 1))" | while read -r old; do
            rm -f "$old" "$old.sha256"
          done
          ls -la "$ARTIFACT_STORE"

  # -------------------------------------------------------------------------
  # Production deployment: a separate job that consumes the artifact built
  # above (or a pinned earlier one) and never rebuilds.
  # -------------------------------------------------------------------------
  deploy:
    name: deploy to production
    needs: [package]
    if: success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: [self-hosted, hpmmo-server]
    concurrency:
      group: server-deploy-production
      cancel-in-progress: false   # a deployment mutation must never be cancelled
    steps:
      - name: Only the release branch may deploy
        run: |
          [ "$GITHUB_REF_NAME" = "main" ] || {
            echo "refusal: $GITHUB_REF_NAME is not the designated release branch (main)" >&2
            exit 1
          }

      - name: Resolve the pinned artifact
        id: id
        run: |
          set -eu
          id="${{ inputs.release_id }}"
          [ -n "$id" ] || id="${{ needs.package.outputs.release_id }}"
          case "$id" in *[!0-9a-f]*|'') echo "::error::bad release id '$id'"; exit 1 ;; esac
          archive="$ARTIFACT_STORE/hpmmo-server-$id.tar.gz"
          test -f "$archive" || { echo "::error::$archive is not in the host artifact store"; ls -la "$ARTIFACT_STORE"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Deploy through the release controller
        # The controller is the only thing that mutates the deployment: it
        # re-verifies SHA256SUMS, announces maintenance, drains, saves, stops,
        # migrates, switches `current` atomically, restarts, verifies (health,
        # ready, schema, version, ONLINE, synthetic login), rolls back on any
        # failure, and prunes old release trees. Its exit code is the verdict.
        run: |
          sudo /opt/hpmmo/bin/hpmmo_deploy.sh --deploy "${{ steps.id.outputs.archive }}" \
            --id "${{ steps.id.outputs.release_id }}" --reason "ci:${{ github.run_id }}" --countdown 30

      - name: Assert the box reports the deployed release ONLINE
        run: |
          set -eu
          status="$(sudo /opt/hpmmo/bin/hpmmo_deploy.sh --status)"
          printf '%s\n' "$status"
          printf '%s\n' "$status" | grep -Eq '^state:[[:space:]]+ONLINE$' || {
            echo "::error::the controller reports the deployment is not ONLINE" >&2; exit 1; }
          printf '%s\n' "$status" | grep -Eq "^release:[[:space:]]+${{ steps.id.outputs.release_id }}$" || {
            echo "::error::the box does not report release ${{ steps.id.outputs.release_id }}" >&2; exit 1; }

      - name: Publish the deployment record
        if: always()
        run: |
          {
            echo "### Server release"
            echo "- release id: \`${{ steps.id.outputs.release_id }}\`"
            echo "- deploy job: \`${{ job.status }}\`"
            echo "- rollback: see server/docs/runbook-rollback.md"
          } >> "$GITHUB_STEP_SUMMARY"
